<script>
// Si algo falla (por ejemplo en Safari de iOS), mostrar el error en pantalla en vez de quedar en blanco
function showFatal(e) {
  var d = document.getElementById("fatal");
  if (!d) { d = document.createElement("div"); d.id = "fatal"; document.body.appendChild(d); }
  d.textContent = "Error: " + (e && (e.message || e.reason || e)) + " - Toma captura y enviasela a Claude.";
  var l = document.getElementById("loading"); if (l) l.remove();
}
window.addEventListener("error", function (ev) { showFatal(ev.error || ev.message); });
</script>
